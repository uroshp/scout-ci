# Scout self-serve generation — the async out-of-band worker (Parts 2/3).
#
# TRIGGER: the DEPLOYED app writes the request to the PRIVATE data repo (selfserve/requests/<id>.json)
# and then POSTs a workflow_dispatch here. (A push to the data repo can't trigger a workflow in this
# code repo, so the app dispatches explicitly — same pattern as the Cloud Scheduler monitor trigger.)
#
# PRIVACY: user requests + generated cards + the spend ledger are USER DATA and live in a SEPARATE
# PRIVATE repo (SELFSERVE_REPO), never this public code repo. This runner reads/writes that repo via
# the GitHub API (scout.selfserve's backend, selected by SELFSERVE_GH_TOKEN+SELFSERVE_REPO) — it does
# NOT commit anything to the code repo, so there is nothing to push and no chance of leaking user data
# into the public showcase. write=False in generate() also guarantees it never touches battlecards/.
#
# SAFETY: the `concurrency` group SERIALIZES runs so the state.json read-modify-write (the gate
# counter + spend ledger) can never race, even if the app dispatches several at once.
#
# REQUIRED SECRETS (this code repo's Actions secrets):
#   ANTHROPIC_API_KEY   — generation spend lands here.
#   SELFSERVE_GH_TOKEN  — token with Contents:R/W on the DATA repo (read requests, write results+state).
#   SELFSERVE_REPO      — the private data repo, e.g. "uroshp/scout-user-data".
name: selfserve

on:
  workflow_dispatch:

concurrency:
  group: scout-selfserve
  cancel-in-progress: false

permissions:
  contents: read                 # only to check out the code repo; user data is written via API

jobs:
  selfserve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2          # the v2 app lives in v2/; run all steps from there
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Generate queued self-serve report(s) into the private data repo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SELFSERVE_GH_TOKEN: ${{ secrets.SELFSERVE_GH_TOKEN }}
          SELFSERVE_REPO: ${{ secrets.SELFSERVE_REPO }}
          # Shadow-eval capture (v3.5): a self-serve card is a real paid generation, so record its
          # champion decisions to the PRIVATE data repo too (pure observer — scout/shadow.py).
          SCOUT_SHADOW_EVAL: "1"
        run: python scripts/run_selfserve.py
