# Scout v2 monitoring — the headless writer (spec §2).
#
# TRIGGER: Google Cloud Scheduler (uptime SLA, timezone-aware) fires workflow_dispatch at
# 7:00 AM America/New_York, Mon–Sat (one run a day since 2026-09; the header below predates that and
# the Batman card is weekly, not opted out) — provisioned by v2/scripts/setup_cloud_scheduler.sh.
# We moved OFF GitHub's `schedule:` cron entirely because it is best-effort and unreliable
# (observed 2026-06-05: the 07:00 ET fire ran 09:46, and the 13:00 ET fire was dropped entirely;
# observed 2026-07-01: the 23:00 UTC backstop fired 73 min late and, after a store reset, became
# an unplanned full evening run). workflow_dispatch is on-demand and starts within seconds.
# NO backstop by owner decision (2026-07-01): if Cloud Scheduler ever misses a day, that window
# is skipped silently — the next morning's run scans since last_checked, so no coverage is lost,
# only timing.
#
# FRESHNESS (the promise): a morning refresh, the same way every day. The due-gate is
# WINDOW-ANCHORED (scout.monitor._is_due vs config.MONITOR_ANCHORS_UTC = "11:00"): a card is
# due only if it hasn't been checked since the most recent passed anchor — so updates never drift,
# and any extra trigger in the same window is a cheap no-op (no API call). This also caps spend at
# one paid check per card per window no matter how many times the workflow is triggered.
#
# DST is automatic: Cloud Scheduler tracks America/New_York for the trigger, and the UTC gate
# anchor stays valid because EST fires land LATER in UTC (12:00) — still past the 11:00 anchor.
# No twice-yearly edit. A card opts out via "monitored": false (none does today; Batman runs weekly
# via cadence_days).
#
# REQUIRED SECRETS (repo settings): ANTHROPIC_API_KEY, RESEND_API_KEY, SCOUT_ALERT_TO
# (SCOUT_ALERT_FROM optional). The Cloud Scheduler dispatch PAT lives in GCP, not here.
name: monitor
# The run title names a rehearsal so the mini's canary can tell it from the production run
# (it reads the latest completed run on main whose title is not a rehearsal).
run-name: "${{ inputs.rehearsal && format('rehearsal {0}', inputs.rehearsal) || 'monitor' }}"

on:
  workflow_dispatch:               # ONLY trigger — Cloud Scheduler at 7am ET, Mon–Sat
    # Optional inputs (2026-09-28). Cloud Scheduler posts {"ref":"main"} with none, so every
    # default below is the scheduled run's behaviour. A manual dispatch with dry_run=true runs the
    # check with NO writes, NO email and NO commit (the commit step is skipped), on the cards named
    # in `slugs` (comma list; empty = all due cards), ignoring the due gate when force=true, with the
    # structured-source tools on when sources_tools=true. Used to test rc before promotion.
    inputs:
      dry_run:
        description: "no writes, no email, no commit"
        type: boolean
        default: false
      slugs:
        description: "comma list of card slugs (empty = all due)"
        type: string
        default: ""
      force:
        description: "ignore the due gate"
        type: boolean
        default: false
      sources_tools:
        description: "SCOUT_SOURCES_TOOLS=1 (scoutsources MCP server on)"
        type: boolean
        default: false
      reason:
        description: "why this run was dispatched (a signal poller's hint; the store is the truth)"
        type: string
        default: ""
      # REHEARSAL (2026-10-03): the REAL write path on retired cards (comma list of v2/archive slugs),
      # into a store root outside the checkout, with every private-store write under rehearsal/ and
      # every email subject prefixed "[rehearsal]". The cards persist between rehearsals in the
      # private store, so each rehearsal scans since the previous one. Nothing is committed. Legal
      # on any ref: a rehearsal on main proves the code and the expressions the 4 AM run will use.
      rehearsal:
        description: "rehearsal: comma list of archive card slugs (live write path, isolated store, no commit)"
        type: string
        default: ""
      since:
        description: "force the detection cutoff (YYYY-MM-DD) for every checked card (rehearsals)"
        type: string
        default: ""
      sensors:
        description: "override SCOUT_SENSORS for this run: off | shadow | gate (rehearsals; empty = the repo variable)"
        type: string
        default: ""

concurrency:
  # a rehearsal has its own group: it never queues the scheduled run (its stores are isolated)
  group: ${{ inputs.rehearsal && 'scout-rehearsal' || 'scout-monitor' }}
  cancel-in-progress: false

permissions:
  contents: write                # to commit + push updated battlecards

jobs:
  monitor:
    runs-on: ubuntu-latest
    # a morning never needs more than an hour; a hang must not hold the runner (and the concurrency
    # group, and every dispatch behind it) for GitHub's six-hour default (2026-10-08)
    timeout-minutes: 90
    defaults:
      run:
        working-directory: v2          # the v2 app lives in v2/; run all steps from there
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Headless browser for the sensors' rendered-fetch tier (only when sensors are on)
        # pages the plain fetcher cannot read (JavaScript shells, 401/403 to a plain client) are read
        # by the same Chromium the deploy probe uses; cached so the install costs seconds, not minutes
        if: ${{ (inputs.sensors || vars.SCOUT_SENSORS || 'off') != 'off' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('v2/requirements.txt') }}
      - if: ${{ (inputs.sensors || vars.SCOUT_SENSORS || 'off') != 'off' }}
        run: python -m playwright install --with-deps chromium
      - name: Rehearsal prep (restore or copy the retired cards into the isolated store)
        if: ${{ inputs.rehearsal != '' }}
        env:
          SCOUT_SELFSERVE_DATA_PREFIX: rehearsal
          SELFSERVE_GH_TOKEN: ${{ secrets.SELFSERVE_GH_TOKEN }}
          SELFSERVE_REPO: ${{ secrets.SELFSERVE_REPO }}
        run: python scripts/rehearse.py prep "${{ inputs.rehearsal }}" --root "$RUNNER_TEMP/rehearsal/battlecards"
      - name: Run monitoring checks (live)
        id: monitor
        env:
          SCOUT_MONITOR_LIVE: ${{ inputs.dry_run && '0' || '1' }}
          SCOUT_MONITOR_SLUGS: ${{ inputs.rehearsal || inputs.slugs }}
          SCOUT_MONITOR_FORCE: ${{ (inputs.force || inputs.rehearsal) && '1' || '0' }}
          SCOUT_MONITOR_SINCE: ${{ inputs.since }}
          SCOUT_SOURCES_TOOLS: ${{ inputs.sources_tools && '1' || '0' }}
          SCOUT_MONITOR_TRACE: ${{ inputs.dry_run && '1' || '0' }}
          SCOUT_MONITOR_REASON: ${{ inputs.reason }}
          SCOUT_LANE_ALERTS: "1"        # the lane's own runner: a refusal (preflight) may email
          # REHEARSAL: the card store moves out of the checkout and the private store under
          # rehearsal/; scout.monitor.preflight refuses the flag without both.
          SCOUT_REHEARSAL: ${{ inputs.rehearsal && '1' || '0' }}
          SCOUT_STORE_ROOT: ${{ inputs.rehearsal && format('{0}/rehearsal/battlecards', runner.temp) || '' }}
          # The store follows the ref: a run from `rc` reads and writes under rc/ (signals, ask
          # ledger, capture), never production's paths, and never falls back to them.
          # The truthy branch must be the NON-empty value: `cond && '' || 'rc'` yields 'rc' on
          # main too, because '' is falsy and the || takes over (the 2026-09-30 4 AM production
          # run wrote its whole store output under rc/ that way). A rehearsal writes under
          # rehearsal/ on any ref; preflight asserts the result before any spend.
          SCOUT_SELFSERVE_DATA_PREFIX: ${{ inputs.rehearsal && 'rehearsal' || (github.ref_name == 'rc' && 'rc' || '') }}
          # Signals (WS3): the run reads open filings / new-department events from the store and
          # puts them in front of triage, with the hiring context line. Off until promoted.
          SCOUT_SIGNALS: ${{ vars.SCOUT_SIGNALS || '0' }}
          # Sensors (Release 2, 2026-10-04): off | shadow | gate. A repo variable, so the cutover and
          # any rollback are a variable flip, no deploy; a dispatch may override it for a rehearsal.
          SCOUT_SENSORS: ${{ inputs.sensors || vars.SCOUT_SENSORS || 'off' }}
          # Propagation (spec §17) in REVIEW (human-approval gate): on an act-grade grounded
          # development (ours or the competitor's), run propose->judge, LOG the decisions + grounding
          # facts to the PRIVATE data repo, and EMAIL the proposed change (where/what/how/verdict).
          # The rep-facing card is NEVER auto-mutated — a human approves a proposal in-session and it
          # is applied via scout/review.py. Promote to "live" (auto-apply) only after the authorship
          # judge earns it. Cost is bounded + rare: ~$0.25 propose/judge per act-grade event, plus
          # ~$0.5-1 my_company grounding on an act-grade OWN development. The my_company + propagation
          # blocks are wrapped so a failure there can never disrupt the competitor monitor.
          # LIVE since 2026-09-29 (his decision 2026-09-28 after 5 consecutive ELIGIBLE check-ins,
          # 196/198 = 0.99): confirmed ops apply through the anchor refresh + provenance gate; the
          # run sends ONE cumulative FYI and, only when something needs him, ONE "needs you" email.
          SCOUT_PROPAGATE_MODE: "live"
          # Consequentiality filter as a GATE (his decision 2026-09-28: all 93 shadow verdicts
          # reviewed and agreed): a routine run's routed updates are deferred, listed in the FYI.
          SCOUT_CONSEQUENTIAL_FILTER: "gate"
          # Propose/author budget (2026-08-31): the default $0.60 cap crashed mid-stream on a
          # two-fact day (Mistral card, ~74k tokens billed for nothing, and a failed propagation
          # never retries — the facts are already fingerprinted as alerted). $1.00 only affects
          # runs that would otherwise crash; normal runs finish under the old cap.
          SCOUT_PROPOSE_MAX_BUDGET_USD: "1.00"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Email backend: Gmail SMTP (owner's own account via an app password — no third-party
          # service) is preferred; Resend is the fallback. Owner alerts go to SCOUT_ALERT_TO.
          SCOUT_GMAIL_USER: ${{ secrets.SCOUT_GMAIL_USER }}
          SCOUT_GMAIL_APP_PASSWORD: ${{ secrets.SCOUT_GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SCOUT_ALERT_TO: ${{ secrets.SCOUT_ALERT_TO }}
          SCOUT_ALERT_FROM: ${{ secrets.SCOUT_ALERT_FROM }}
          # Shadow-eval capture (v3.5): record champion decisions to the PRIVATE data repo so an
          # offline challenger can be scored later. Needs the same data-repo token/repo as
          # self-serve (capture writes via the GitHub API, NOT the public-repo git push below;
          # without these it would fall back to local-FS and be discarded). Pure observer — see
          # scout/shadow.py for the non-disruption guarantees.
          SCOUT_SHADOW_EVAL: "1"
          # Call capture for the on-device model comparison (2026-09-28): one bundle per run of
          # every paid call's exact inputs + output, private store only (scout/calllog.py).
          SCOUT_CALL_CAPTURE: "1"
          SELFSERVE_GH_TOKEN: ${{ secrets.SELFSERVE_GH_TOKEN }}
          SELFSERVE_REPO: ${{ secrets.SELFSERVE_REPO }}
        run: python -u -m scout.monitor
      - name: Rehearsal save + summary (the cards live on in the rehearsal store)
        if: ${{ !cancelled() && inputs.rehearsal != '' && steps.monitor.outcome != 'skipped' }}
        env:
          SCOUT_SELFSERVE_DATA_PREFIX: rehearsal
          SELFSERVE_GH_TOKEN: ${{ secrets.SELFSERVE_GH_TOKEN }}
          SELFSERVE_REPO: ${{ secrets.SELFSERVE_REPO }}
        run: |
          python scripts/rehearse.py save "${{ inputs.rehearsal }}" --root "$RUNNER_TEMP/rehearsal/battlecards"
          python scripts/rehearse.py summary "${{ inputs.rehearsal }}" --root "$RUNNER_TEMP/rehearsal/battlecards" --out "$GITHUB_STEP_SUMMARY"
      - name: Commit per §9 policy (last_checked bump every run; content on material change)
        # Run even when the monitor step exits 1 (a PARTIAL failure: scout.monitor now
        # continues past a single bad card and exits non-zero only after every card ran),
        # so the cards that DID check successfully still get their results committed.
        # Skipped only if the monitor never ran (checkout/pip failure) or was cancelled, on a
        # dry run, and on a rehearsal (its cards live outside the checkout; nothing to commit).
        if: ${{ !cancelled() && steps.monitor.outcome != 'skipped' && !inputs.dry_run && inputs.rehearsal == '' }}
        run: |
          git config user.name "scout-monitor[bot]"
          git config user.email "scout-monitor@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No store changes."
          else
            # Content (claims/current/alerts) changes only on a material change; a quiet run
            # stages just meta.json (the last_checked timestamp bump).
            if git diff --cached --name-only | grep -qE 'claims.json|current.md|alerts'; then
              git commit -m "monitor: material change(s) detected"
            else
              git commit -m "monitor: heartbeat (advance last_checked)"
            fi
            # PUSH RACE (2026-09-02): a ~40-min run can lose main to a morning human approval
            # pushed mid-run (the bot's end-of-run push is rejected and the whole run's store
            # write is dropped). Rebase the bot commit onto the moved head and retry; a genuine
            # content conflict still fails loudly — never silently clobbered.
            for i in 1 2 3; do
              git push && break
              git pull --rebase || exit 1
            done
          fi
