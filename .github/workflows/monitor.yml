# Scout v2 monitoring cron — the headless writer (spec §2).
#
# SAFETY: GitHub fires `schedule` ONLY from the DEFAULT branch. While this lives on
# v2-agent (not merged to main), it is INERT — it will not run or spend a cent. It goes
# live only when you choose to merge to the default branch.
#
# CADENCE: the schedule fires every 6h, but the ACTUAL per-card interval is governed by
# `cadence_hours` in each meta.json + the due-gate in run_all(): a card is only checked when
# its own cadence has elapsed. So launch-window showcase cards (cadence_hours: 6) check 4x/day
# while slow ones (cadence_hours: 24) still check once daily — one schedule, per-competitor rate.
# Dial cadence_hours back up after week one. The schedule must fire AT LEAST as often as the
# smallest cadence_hours, or the gate can never release that card on time.
#
# REQUIRED SECRETS (set in repo settings before enabling): ANTHROPIC_API_KEY,
# RESEND_API_KEY, SCOUT_ALERT_TO  (SCOUT_ALERT_FROM optional).
name: monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"        # every 6h (00,06,12,18 UTC); per-card due-gate honors cadence_hours.

concurrency:
  group: scout-monitor
  cancel-in-progress: false

permissions:
  contents: write                # to commit + push updated battlecards

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Run monitoring checks (live)
        env:
          SCOUT_MONITOR_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SCOUT_ALERT_TO: ${{ secrets.SCOUT_ALERT_TO }}
          SCOUT_ALERT_FROM: ${{ secrets.SCOUT_ALERT_FROM }}
        run: python -m scout.monitor
      - name: Commit per §9 policy (last_checked bump every run; content on material change)
        run: |
          git config user.name "scout-monitor[bot]"
          git config user.email "scout-monitor@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No store changes."
          else
            # Content (claims/current/alerts) changes only on a material change; a quiet run
            # stages just meta.json (the last_checked timestamp bump).
            if git diff --cached --name-only | grep -qE 'claims.json|current.md|alerts'; then
              git commit -m "monitor: material change(s) detected"
            else
              git commit -m "monitor: heartbeat — advance last_checked"
            fi
            git push
          fi
