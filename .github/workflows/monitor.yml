# Scout v2 monitoring cron — the headless writer (spec §2).
#
# SAFETY: GitHub fires `schedule` ONLY from the DEFAULT branch. While this lives on
# v2-agent (not merged to main), it is INERT — it will not run or spend a cent. It goes
# live only when you choose to merge to the default branch.
#
# CADENCE: the launch promise is PREDICTABLE freshness — a morning refresh and a midday
# refresh, the same way every day (7am + 1pm US Eastern). The due-gate is WINDOW-ANCHORED
# (scout.monitor._is_due against config.MONITOR_ANCHORS_UTC = "11:00,17:00"): a card is due
# when it hasn't been checked since the most recent passed anchor, so updates never drift
# (a relative last_checked+cadence_hours gate slides later on every check — the bug that
# scattered updates across random times).
#
# Why BURST and not a single "0 11"/"0 17": GitHub `schedule` is best-effort and routinely
# runs minutes-to-hours late (observed 2026-06-05: an 11:00 UTC fire landed 13:46) and can be
# dropped. So we fire every 30 min across each window; the FIRST fire that actually lands
# after an anchor does the check, and the anchor gate makes every later fire in that window a
# cheap no-op (a not-due card makes no API call). Net: one paid check per card per window,
# reliably in the morning and at midday, even when an individual fire is late or dropped.
#
# DST: June is EDT (UTC-4) → windows 11-13 / 17-19 UTC = 07:00-09:30 / 13:00-15:30 ET. When the
# US falls back to EST (UTC-5) on 2026-11-01, shift both crons +1h (12-14 / 18-20) AND set
# config.MONITOR_ANCHORS_UTC to "12:00,18:00". To pare down after week one, drop a window.
# A card can opt OUT entirely via "monitored": false in its meta.json (the Batman stress-test
# card does).
#
# REQUIRED SECRETS (set in repo settings before enabling): ANTHROPIC_API_KEY,
# RESEND_API_KEY, SCOUT_ALERT_TO  (SCOUT_ALERT_FROM optional).
name: monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 11-13 * * *"   # morning window 11:00-13:30 UTC = 07:00-09:30 ET (EDT); anchor 11:00 = 7am ET
    - cron: "*/30 17-19 * * *"   # midday  window 17:00-19:30 UTC = 13:00-15:30 ET (EDT); anchor 17:00 = 1pm ET

concurrency:
  group: scout-monitor
  cancel-in-progress: false

permissions:
  contents: write                # to commit + push updated battlecards

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2          # the v2 app lives in v2/; run all steps from there
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Run monitoring checks (live)
        env:
          SCOUT_MONITOR_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SCOUT_ALERT_TO: ${{ secrets.SCOUT_ALERT_TO }}
          SCOUT_ALERT_FROM: ${{ secrets.SCOUT_ALERT_FROM }}
        run: python -m scout.monitor
      - name: Commit per §9 policy (last_checked bump every run; content on material change)
        run: |
          git config user.name "scout-monitor[bot]"
          git config user.email "scout-monitor@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No store changes."
          else
            # Content (claims/current/alerts) changes only on a material change; a quiet run
            # stages just meta.json (the last_checked timestamp bump).
            if git diff --cached --name-only | grep -qE 'claims.json|current.md|alerts'; then
              git commit -m "monitor: material change(s) detected"
            else
              git commit -m "monitor: heartbeat — advance last_checked"
            fi
            git push
          fi
