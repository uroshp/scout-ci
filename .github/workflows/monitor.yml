# Scout v2 monitoring — the headless writer (spec §2).
#
# TRIGGER: Google Cloud Scheduler (uptime SLA, timezone-aware) fires workflow_dispatch at
# exactly 7:00 AM + 1:00 PM America/New_York — provisioned by v2/scripts/setup_cloud_scheduler.sh.
# We moved OFF GitHub's `schedule:` cron entirely because it is best-effort and unreliable
# (observed 2026-06-05: the 07:00 ET fire ran 09:46, and the 13:00 ET fire was dropped entirely;
# observed 2026-07-01: the 23:00 UTC backstop fired 73 min late and, after a store reset, became
# an unplanned full evening run). workflow_dispatch is on-demand and starts within seconds.
# NO backstop by owner decision (2026-07-01): if Cloud Scheduler ever misses a day, that window
# is skipped silently — the next morning's run scans since last_checked, so no coverage is lost,
# only timing.
#
# FRESHNESS (the promise): a morning + midday refresh, the same way every day. The due-gate is
# WINDOW-ANCHORED (scout.monitor._is_due vs config.MONITOR_ANCHORS_UTC = "11:00,17:00"): a card is
# due only if it hasn't been checked since the most recent passed anchor — so updates never drift,
# and any extra trigger in the same window is a cheap no-op (no API call). This also caps spend at
# one paid check per card per window no matter how many times the workflow is triggered.
#
# DST is automatic: Cloud Scheduler tracks America/New_York for the trigger, and the UTC gate
# anchors stay valid because EST fires land LATER in UTC (12:00/18:00) — still past the 11:00/17:00
# anchors. No twice-yearly edit. (To pare down after week one, drop an anchor in config + its
# Cloud Scheduler job.) A card opts out via "monitored": false (the Batman stress-test card does).
#
# REQUIRED SECRETS (repo settings): ANTHROPIC_API_KEY, RESEND_API_KEY, SCOUT_ALERT_TO
# (SCOUT_ALERT_FROM optional). The Cloud Scheduler dispatch PAT lives in GCP, not here.
name: monitor

on:
  workflow_dispatch:               # ONLY trigger — Cloud Scheduler at 7am ET, Mon–Sat

concurrency:
  group: scout-monitor
  cancel-in-progress: false

permissions:
  contents: write                # to commit + push updated battlecards

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2          # the v2 app lives in v2/; run all steps from there
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Run monitoring checks (live)
        id: monitor
        env:
          SCOUT_MONITOR_LIVE: "1"
          # Propagation (spec §17) in REVIEW (human-approval gate): on an act-grade grounded
          # development (ours or the competitor's), run propose->judge, LOG the decisions + grounding
          # facts to the PRIVATE data repo, and EMAIL the proposed change (where/what/how/verdict).
          # The rep-facing card is NEVER auto-mutated — a human approves a proposal in-session and it
          # is applied via scout/review.py. Promote to "live" (auto-apply) only after the authorship
          # judge earns it. Cost is bounded + rare: ~$0.25 propose/judge per act-grade event, plus
          # ~$0.5-1 my_company grounding on an act-grade OWN development. The my_company + propagation
          # blocks are wrapped so a failure there can never disrupt the competitor monitor.
          SCOUT_PROPAGATE_MODE: "review"
          # Propose/author budget (2026-08-31): the default $0.60 cap crashed mid-stream on a
          # two-fact day (Mistral card, ~74k tokens billed for nothing, and a failed propagation
          # never retries — the facts are already fingerprinted as alerted). $1.00 only affects
          # runs that would otherwise crash; normal runs finish under the old cap.
          SCOUT_PROPOSE_MAX_BUDGET_USD: "1.00"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Email backend: Gmail SMTP (owner's own account via an app password — no third-party
          # service) is preferred; Resend is the fallback. Owner alerts go to SCOUT_ALERT_TO.
          SCOUT_GMAIL_USER: ${{ secrets.SCOUT_GMAIL_USER }}
          SCOUT_GMAIL_APP_PASSWORD: ${{ secrets.SCOUT_GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SCOUT_ALERT_TO: ${{ secrets.SCOUT_ALERT_TO }}
          SCOUT_ALERT_FROM: ${{ secrets.SCOUT_ALERT_FROM }}
          # Shadow-eval capture (v3.5): record champion decisions to the PRIVATE data repo so an
          # offline challenger can be scored later. Needs the same data-repo token/repo as
          # self-serve (capture writes via the GitHub API, NOT the public-repo git push below;
          # without these it would fall back to local-FS and be discarded). Pure observer — see
          # scout/shadow.py for the non-disruption guarantees.
          SCOUT_SHADOW_EVAL: "1"
          SELFSERVE_GH_TOKEN: ${{ secrets.SELFSERVE_GH_TOKEN }}
          SELFSERVE_REPO: ${{ secrets.SELFSERVE_REPO }}
        run: python -m scout.monitor
      - name: Commit per §9 policy (last_checked bump every run; content on material change)
        # Run even when the monitor step exits 1 (a PARTIAL failure: scout.monitor now
        # continues past a single bad card and exits non-zero only after every card ran),
        # so the cards that DID check successfully still get their results committed.
        # Skipped only if the monitor never ran (checkout/pip failure) or was cancelled.
        if: ${{ !cancelled() && steps.monitor.outcome != 'skipped' }}
        run: |
          git config user.name "scout-monitor[bot]"
          git config user.email "scout-monitor@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No store changes."
          else
            # Content (claims/current/alerts) changes only on a material change; a quiet run
            # stages just meta.json (the last_checked timestamp bump).
            if git diff --cached --name-only | grep -qE 'claims.json|current.md|alerts'; then
              git commit -m "monitor: material change(s) detected"
            else
              git commit -m "monitor: heartbeat (advance last_checked)"
            fi
            git push
          fi
