[server]
headless = true
fileWatcherType = "none"   # production has no source hot-reload; this stops the inotify-watch-limit traceback spam on Streamlit Cloud
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

# Pin the theme. The UI is a sober, light/editorial battlecard: cream paper, dark ink text,
# a slate accent (matches docs/mockups/command-center.html). The custom CSS uses dark text
# (#1c1d16 / #5f5e54 muted / #908e82 faint) on the cream canvas, so we pin base="light" for
# EVERYONE regardless of OS setting — otherwise a dark-mode visitor would get a dark canvas
# where that dark text is invisible (the mirror of the old light-on-dark bug). primaryColor
# matches the #34566b slate accent.
[theme]
base = "light"
backgroundColor = "#f4f2ec"
secondaryBackgroundColor = "#fbfaf6"
textColor = "#1c1d16"
primaryColor = "#34566b"
