# GitOps deploy: build the Flask viewer image and ship it to Cloud Run.
# Fired by the Cloud Build trigger (agent-scout-deploy) on pushes to main that touch v2/** —
# i.e. when the agent commits a battlecard update (or viewer code changes). The agent's commit
# -> this build -> live, so Cloud Run refreshes alongside Streamlit. No cron.
#
# Deploys by --image only, so the service's existing config (env vars, secrets, scaling, the
# allUsers invoker binding) is preserved across deploys; this build just swaps in the new image.
#
# ONE build definition, TWO services (2026-09-28): the production trigger (branch main) leaves
# _SERVICE at its default; the RC trigger (agent-scout-rc-deploy, branch rc) sets
# _SERVICE=agent-scout-rc, so the release-candidate service is built and deployed by exactly the
# same steps. See scripts/setup_rc.sh.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: v2
    args: ['build', '-t', '${_IMAGE}', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=us-west1
      - --quiet
images:
  - '${_IMAGE}'
substitutions:
  _SERVICE: 'agent-scout'
  _IMAGE: 'us-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${SHORT_SHA}'
options:
  logging: CLOUD_LOGGING_ONLY
